  <style>
    :root {
      --background-color: #121212;
      --text-color: #e0e0e0;
      --accent-color: #161616;
      --border-color: #333333;
      --select-color: #00e5ff;
    }
    svg.euclid-graphic {
      width: 100%;
      height: auto;
      max-height: 520px;
      background-color: var(--accent-color);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      display: block;
    }
    .guide {
      fill: none;
      stroke: var(--border-color);
      stroke-width: 1.2;
      stroke-dasharray: 4 4;
      vector-effect: non-scaling-stroke;
    }
    .triangle {
      fill: none;
      stroke: var(--text-color);
      stroke-width: 1.8;
      vector-effect: non-scaling-stroke;
      opacity: 0.75;
    }
    .cubic-curve {
      fill: none;
      stroke: var(--select-color);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }
    .vertex-point {
      fill: #66ff66;
      stroke: var(--background-color);
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
    }
    .center-point {
      fill: #ffaa33;
      stroke: var(--background-color);
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
    }
    .vertex-label, .center-label {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.42px;
      font-weight: 600;
      fill: var(--text-color);
    }
    .center-label {
      fill: #ffcc77;
    }
  </style>
